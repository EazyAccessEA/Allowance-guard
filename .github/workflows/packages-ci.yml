name: packages-ci

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/packages-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'scripts/generate-openapi.ts'
      - 'src/app/api/v1/openapi.json'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/packages-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'scripts/generate-openapi.ts'
      - 'src/app/api/v1/openapi.json'

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI client types
        run: pnpm run generate:openapi

      - name: Typecheck @allowance-guard/client
        run: pnpm --filter @allowance-guard/client typecheck

      - name: Test @allowance-guard/client
        run: pnpm --filter @allowance-guard/client test

      - name: Build @allowance-guard/client
        run: pnpm --filter @allowance-guard/client build

      - name: Typecheck @allowance-guard/react
        run: pnpm --filter @allowance-guard/react typecheck

      - name: Test @allowance-guard/react
        run: pnpm --filter @allowance-guard/react test

      - name: Build @allowance-guard/react
        run: pnpm --filter @allowance-guard/react build
