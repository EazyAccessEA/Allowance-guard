name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check CLA acknowledgment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Repository owner and bots are exempt from CLA
            const exemptUsers = [
              'EazyAccessEA',
              'dependabot[bot]',
              'renovate[bot]',
              'github-actions[bot]',
            ];

            if (exemptUsers.includes(author)) {
              core.info(`${author} is exempt from CLA requirement.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: 'CLA Verification',
                description: 'CLA not required for this contributor.',
              });
              return;
            }

            // Load known signatories from the repo
            let signatories = [];
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/cla-signatures.json',
              });
              const content = Buffer.from(data.content, 'base64').toString('utf-8');
              signatories = JSON.parse(content).signatories || [];
            } catch (e) {
              core.info('No cla-signatures.json found, treating all as unsigned.');
            }

            // Check if user has previously signed
            const hasSigned = signatories.some(
              (s) => s.github_username.toLowerCase() === author.toLowerCase()
            );

            if (hasSigned) {
              core.info(`${author} has already signed the CLA.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: 'CLA Verification',
                description: 'CLA signed.',
              });
              return;
            }

            // Check PR body for CLA checkbox acknowledgment
            const prBody = pr.body || '';
            const claChecked = /- \[x\].*Contributor License Agreement/i.test(prBody);

            if (claChecked) {
              core.info(`${author} acknowledged CLA via PR checkbox.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: 'CLA Verification',
                description: 'CLA acknowledged in pull request.',
              });
              return;
            }

            // Check PR comments for CLA agreement
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            const claComment = comments.data.find(
              (c) =>
                c.user.login.toLowerCase() === author.toLowerCase() &&
                (/I confirm that I have read and agree to the AllowanceGuard CLA/i.test(c.body) ||
                 /I have read and agree to the.*Contributor License Agreement/i.test(c.body))
            );

            if (claComment) {
              core.info(`${author} acknowledged CLA via comment.`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: 'CLA Verification',
                description: 'CLA acknowledged via comment.',
              });
              return;
            }

            // CLA not signed — post a comment and set pending status
            core.warning(`${author} has not signed the CLA.`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: 'CLA Verification',
              description: 'CLA agreement required. Please check the CLA box or comment.',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CLA.md`,
            });

            // Check if we already posted a CLA reminder to avoid duplicates
            const botComments = comments.data.filter(
              (c) =>
                c.user.type === 'Bot' &&
                c.body.includes('Contributor License Agreement')
            );

            if (botComments.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## Contributor License Agreement

Hi @${author}, thanks for your contribution! Before we can merge this PR, you need to agree to our [Contributor License Agreement](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CLA.md).

**How to sign:**

1. **Option A (recommended):** Edit your PR description and check the CLA checkbox, then push a new commit or re-open the PR to re-trigger this check.
2. **Option B:** Comment on this PR with:
   > I confirm that I have read and agree to the AllowanceGuard CLA v1.1 for this Contribution and all future Contributions.

The CLA grants AllowanceGuard the right to distribute your contributions under both AGPL-3.0 and our commercial license. **You retain full copyright ownership** of your work. See the full [CLA v1.1](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CLA.md) for details.

_This is an automated message._`,
              });
            }
