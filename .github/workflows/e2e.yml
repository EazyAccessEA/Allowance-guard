name: E2E
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_E2E: "1"
      E2E_FAKE_PAYMENTS: "1"
      E2E_FAKE_EMAIL: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm i --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true  # Advisory only — don't block on upstream vulnerabilities

      - run: npx playwright install --with-deps
      - run: pnpm build
      - name: Run E2E tests
        run: pnpm -s playwright test --reporter=list
