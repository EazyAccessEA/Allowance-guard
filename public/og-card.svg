<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008B7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#008B7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008B7A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="ctaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008B7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
    
    <!-- Patterns -->
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <rect width="1200" height="630" fill="url(#gridPattern)"/>
  
  <!-- Background Circles -->
  <circle cx="240" cy="504" r="120" fill="rgba(0,139,122,0.1)" opacity="0.6"/>
  <circle cx="960" cy="126" r="80" fill="rgba(59,130,246,0.1)" opacity="0.6"/>
  <circle cx="480" cy="252" r="60" fill="rgba(139,92,246,0.05)" opacity="0.6"/>
  
  <!-- Logo -->
  <rect x="80" y="80" width="60" height="60" rx="16" fill="url(#logoGradient)" filter="url(#glow)"/>
  <text x="110" y="115" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="900">AG</text>
  <text x="160" y="115" fill="white" font-family="Inter, sans-serif" font-size="28" font-weight="800">Allowance Guard</text>
  
  <!-- Main Title -->
  <text x="80" y="200" fill="url(#titleGradient)" font-family="Inter, sans-serif" font-size="64" font-weight="900">
    <tspan x="80" dy="0">Secure Your</tspan>
    <tspan x="80" dy="70">Wallet Permissions</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="320" fill="#a0a0a0" font-family="Inter, sans-serif" font-size="24" font-weight="500">
    <tspan x="80" dy="0">Review, revoke, and monitor token approvals</tspan>
    <tspan x="80" dy="35">across all major blockchains</tspan>
  </text>
  
  <!-- Features -->
  <rect x="80" y="380" width="200" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="90" y="390" width="20" height="20" rx="4" fill="url(#logoGradient)"/>
  <text x="120" y="405" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600">Free & Open Source</text>
  
  <rect x="300" y="380" width="220" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="310" y="390" width="20" height="20" rx="4" fill="url(#logoGradient)"/>
  <text x="340" y="405" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600">Multi-Chain Support</text>
  
  <!-- CTA Button -->
  <rect x="80" y="460" width="200" height="60" rx="16" fill="url(#ctaGradient)" filter="url(#glow)"/>
  <text x="180" y="495" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="18" font-weight="700">Start Securing →</text>
  
  <!-- Shield Visual -->
  <circle cx="800" cy="315" r="140" fill="url(#shieldGradient)" stroke="rgba(0,139,122,0.3)" stroke-width="2"/>
  <circle cx="800" cy="315" r="100" fill="url(#shieldGradient)" stroke="rgba(0,139,122,0.4)" stroke-width="2"/>
  <rect x="760" y="275" width="80" height="80" rx="20" fill="url(#logoGradient)" filter="url(#glow)"/>
  <text x="800" y="320" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="32" font-weight="900">🛡️</text>
  
  <!-- Floating Elements -->
  <rect x="1000" y="100" width="60" height="60" rx="8" fill="rgba(0,139,122,0.1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="100" y="500" width="40" height="40" rx="8" fill="rgba(59,130,246,0.1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="100" y="200" width="30" height="30" rx="8" fill="rgba(139,92,246,0.1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Chain Icons -->
  <rect x="1000" y="550" width="32" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="1016" y="570" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700">ETH</text>
  
  <rect x="1040" y="550" width="32" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="1056" y="570" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700">ARB</text>
  
  <rect x="1080" y="550" width="32" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="1096" y="570" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700">BASE</text>
  
  <rect x="1120" y="550" width="32" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="1136" y="570" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700">MATIC</text>
  
  <rect x="1160" y="550" width="32" height="32" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="1176" y="570" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700">OP</text>
</svg>
