<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allowance Guard - OpenGraph Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0A0A0A 0%, #1a1a1a 50%, #0A0A0A 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Background Pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 139, 122, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }
        
        /* Grid Pattern */
        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        /* Main Content */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 80px;
        }
        
        .left-section {
            flex: 1;
            color: white;
        }
        
        .right-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Logo Area */
        .logo-container {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #008B7A, #00D4AA);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            box-shadow: 0 8px 32px rgba(0, 139, 122, 0.3);
        }
        
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Main Title */
        .main-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffffff, #008B7A, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Subtitle */
        .subtitle {
            font-size: 24px;
            font-weight: 500;
            color: #a0a0a0;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        
        /* Features */
        .features {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .feature-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #008B7A, #00D4AA);
            border-radius: 4px;
            margin-right: 12px;
        }
        
        .feature-text {
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        
        /* CTA */
        .cta {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #008B7A, #00D4AA);
            color: white;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 32px rgba(0, 139, 122, 0.4);
            transition: all 0.3s ease;
        }
        
        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 139, 122, 0.5);
        }
        
        /* Visual Elements */
        .visual-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        
        .shield {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, rgba(0, 139, 122, 0.2), rgba(59, 130, 246, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 139, 122, 0.3);
        }
        
        .shield-inner {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(0, 139, 122, 0.3), rgba(59, 130, 246, 0.3));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 139, 122, 0.4);
        }
        
        .shield-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #008B7A, #00D4AA);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 139, 122, 0.4);
        }
        
        /* Floating Elements */
        .floating-element {
            position: absolute;
            background: linear-gradient(135deg, rgba(0, 139, 122, 0.1), rgba(59, 130, 246, 0.1));
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .floating-1 {
            width: 60px;
            height: 60px;
            top: 20px;
            right: 20px;
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-2 {
            width: 40px;
            height: 40px;
            bottom: 40px;
            left: 20px;
            animation: float 8s ease-in-out infinite reverse;
        }
        
        .floating-3 {
            width: 30px;
            height: 30px;
            top: 100px;
            left: 20px;
            animation: float 7s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        /* Chain Icons */
        .chains {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 12px;
        }
        
        .chain {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .chain-text {
            font-size: 12px;
            font-weight: 700;
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="grid-pattern"></div>
    
    <div class="content">
        <div class="left-section">
            <div class="logo-container">
                <div class="logo">
                    <div style="color: white; font-size: 24px; font-weight: 900;">AG</div>
                </div>
                <div class="logo-text">Allowance Guard</div>
            </div>
            
            <h1 class="main-title">Secure Your<br>Wallet Permissions</h1>
            
            <p class="subtitle">Review, revoke, and monitor token approvals<br>across all major blockchains</p>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon"></div>
                    <div class="feature-text">Free & Open Source</div>
                </div>
                <div class="feature">
                    <div class="feature-icon"></div>
                    <div class="feature-text">Multi-Chain Support</div>
                </div>
            </div>
            
            <div class="cta">Start Securing →</div>
        </div>
        
        <div class="right-section">
            <div class="visual-container">
                <div class="shield">
                    <div class="shield-inner">
                        <div class="shield-icon">
                            <div style="color: white; font-size: 32px; font-weight: 900;">🛡️</div>
                        </div>
                    </div>
                </div>
                
                <div class="floating-element floating-1"></div>
                <div class="floating-element floating-2"></div>
                <div class="floating-element floating-3"></div>
            </div>
        </div>
    </div>
    
    <div class="chains">
        <div class="chain">
            <div class="chain-text">ETH</div>
        </div>
        <div class="chain">
            <div class="chain-text">ARB</div>
        </div>
        <div class="chain">
            <div class="chain-text">BASE</div>
        </div>
        <div class="chain">
            <div class="chain-text">MATIC</div>
        </div>
        <div class="chain">
            <div class="chain-text">OP</div>
        </div>
    </div>
</body>
</html>
